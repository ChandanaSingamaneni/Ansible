- name: demo on data tpyes
  hosts: local
  connection: local
  vars:
    PROGRAM: "DevSecOps with AWS" # string
    DURATION: 140 # int/number
    IS_LIVE: true # bool
    DETAILS: # map/dictionary
      MONTHS: 4
      TRAINER: "Sivakumar"
    TOPICS: # list -/[]
    - linux
    - shell
    - ansible
  tasks:
  - name: print variables
    ansible.builtin.debug:
      msg: |
        Program: {{ PROGRAM }}
        Duration: {{ DURATION }}
        Is Live?: {{ IS_LIVE }}
        Details: {{ DETAILS }}
        Topics: {{ TOPICS }}

