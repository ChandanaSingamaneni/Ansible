- name: demo on function/ filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, ansible, terraform ## string datatype
    tags:  # map datatype
      name: ansible
      project: roboshop
      component: catalogue

  tasks:
  - name: greeting
    ansible.builtin.debug:
      msg: "Hi Chandana, {{ GREETING | default('Good Morning') }}"
  
  - name: convert string to list
    ansible.builtin.debug:
      msg: "{{ topics | split(',') }}"

  - name: convert map to list
    ansible.builtin.debug:
      msg: "{{ tags | dict2items }}"